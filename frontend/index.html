<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopZone - E-Commerce</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    header { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.8rem; }
    .status { background: #16213e; padding: 0.5rem 2rem; color: #aaa; font-size: 0.85rem; }
    .status span { color: #4ade80; font-weight: bold; }
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-bottom: 1.5rem; color: #1a1a2e; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card h3 { margin-bottom: 0.5rem; color: #1a1a2e; }
    .card p { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
    .price { font-size: 1.3rem; font-weight: bold; color: #e63946; margin-bottom: 1rem; }
    .stock { font-size: 0.8rem; color: #4ade80; margin-bottom: 1rem; }
    .btn { background: #1a1a2e; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; width: 100%; font-size: 0.95rem; transition: background 0.2s; }
    .btn:hover { background: #e63946; }
    .loader { text-align: center; padding: 3rem; color: #999; }
    .error { background: #fee; color: #c00; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
    footer { text-align: center; padding: 2rem; color: #999; margin-top: 3rem; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 ShopZone</h1>
    <span>Production E-Commerce Platform</span>
  </header>
  <div class="status" id="status">Connecting to backend...</div>
  <main>
    <h2>Featured Products</h2>
    <div class="grid" id="products">
      <div class="loader">Loading products...</div>
    </div>
  </main>
  <footer>
    <p>ShopZone &copy; 2025 | Docker Compose + Nginx + PostgreSQL + Redis</p>
  </footer>

  <script>
    const API = '/api';

    async function loadProducts() {
      try {
        const res = await fetch(`${API}/products`);
        const json = await res.json();
        const products = json.data;
        const source = json.source;

        document.getElementById('status').innerHTML =
          `✅ Backend <span>ONLINE</span> | DB Source: <span>${source}</span> | ${new Date().toLocaleTimeString()}`;

        const grid = document.getElementById('products');
        if (!products.length) {
          grid.innerHTML = '<p>No products found.</p>';
          return;
        }
        grid.innerHTML = products.map(p => `
          <div class="card">
            <h3>${p.name}</h3>
            <p>${p.description || 'No description'}</p>
            <div class="price">₹${parseFloat(p.price).toLocaleString()}</div>
            <div class="stock">📦 ${p.stock} in stock</div>
            <button class="btn" onclick="alert('Added ${p.name} to cart!')">Add to Cart</button>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('status').innerHTML = '❌ Backend <span style="color:red">OFFLINE</span>';
        document.getElementById('products').innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }

    loadProducts();
    setInterval(loadProducts, 30000); // refresh every 30s
  </script>
</body>
</html>
